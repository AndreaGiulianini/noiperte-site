name: Verifica sito

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controlli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Valida l'HTML
        run: npx --yes html-validate@9 $(git ls-files '*.html')

      - name: Controlla link, SEO e JSON-LD
        run: python3 tools/check-site.py
